<!doctype html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alphaplus — codebase map</title>
<!--
  ONE FILE. The React bundle and the graph data are both inlined below.
  No CDN, no fetch, no server: this has to open from a file:// URL on a VDI
  with no network. Regenerated by `python -m kb.viz.build`.
-->
<style>
:root{
  --bg:#07090d; --panel:#0e1218; --panel2:#141a22; --line:#1f2833;
  --text:#e8eef6; --dim:#8b9bb0; --faint:#4a5768; --accent:#4ea8ff;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
html[data-t=light]{
  --bg:#fff; --panel:#f7f9fc; --panel2:#eef2f7; --line:#d7dfe9;
  --text:#111820; --dim:#5a6a7d; --faint:#93a2b4; --accent:#0b6bd6;
  --shadow:0 8px 28px rgba(16,32,56,.12);
}
html[data-t=mono]{
  --bg:#000; --panel:#0a0a0a; --panel2:#141414; --line:#282828;
  --text:#f4f4f4; --dim:#9a9a9a; --faint:#5a5a5a; --accent:#fff;
  --shadow:0 8px 32px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .28s ease,color .28s ease}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}

.app{display:flex;flex-direction:column;height:100%}
main{flex:1;display:flex;min-height:0;position:relative}

/* ── toolbar ─────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:14px;padding:9px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:0;padding:6px 13px;border-radius:6px;
  color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;
  transition:background .18s,color .18s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg.small button{padding:5px 9px;font-size:12px;line-height:1}

.find{position:relative;flex:1;max-width:430px}
.find input{width:100%;padding:8px 12px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);outline:none;transition:border-color .18s,box-shadow .18s}
.find input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.find input::placeholder{color:var(--faint)}
.hits{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:5px;
  list-style:none;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);max-height:56vh;overflow:auto;z-index:40}
.hits li{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer}
.hits li:hover{background:var(--panel2)}
.hits b{font-size:13px;min-width:96px}
.hits .ty{color:var(--faint);font-size:11px;min-width:58px}
.hits .lay{font-size:11px;font-weight:700;min-width:64px}
.hits .rc{color:var(--faint);font-size:11px;margin-left:auto}

.right{display:flex;align-items:center;gap:9px;margin-left:auto}
.pick{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.pick select{background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:6px 8px;cursor:pointer}
.tgl{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;color:var(--dim);cursor:pointer;font-size:12.5px;font-weight:600;
  transition:background .18s,color .18s,border-color .18s}
.tgl:hover{color:var(--text)}
.tgl.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-t=mono] .tgl.on{color:#000}

/* ── canvas ──────────────────────────────────────────────── */
.cvwrap{flex:1;position:relative;min-width:0;overflow:hidden}
/* Two stacked canvases. `base` holds the edges and every node and is only
   re-rendered when the picture itself changes; `over` holds the hover ring, the
   selection and the labels and is cleared and redrawn on mouse move. Pointer
   events land on `over` because it is on top - and it is transparent, so `base`
   shows through. This split is why hovering no longer repaints 97,339 edges. */
.cvwrap canvas{position:absolute;inset:0;display:block;touch-action:none}
.cvwrap .cvbase{z-index:1}
.cvwrap .cvover{z-index:2;cursor:grab;background:transparent}
.cvwrap .cvover:active{cursor:grabbing}

/* ── call-tree rail ──────────────────────────────────────── */
.rail{width:308px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  animation:slideIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes slideIn{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
.railhead{padding:12px;border-bottom:1px solid var(--line)}
.rh{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  margin-bottom:6px;font-weight:700}
.railhead select{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:7px 8px;cursor:pointer}
.rowbtn{display:flex;gap:6px;margin-top:8px}
.rowbtn button{flex:1;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:6px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:600}
.rowbtn button:hover{color:var(--text)}
.note{margin-top:8px;font-size:11.5px;color:var(--faint)}
.note b{color:#e0a03a}
.hint{margin-top:8px;font-size:11.5px;color:var(--faint);line-height:1.45}
.hint b{color:var(--dim)}

.out{list-style:none;margin:0;padding:0}
.rail>.out{overflow:auto;padding:8px 6px 24px;flex:1}
.out.sub{margin-left:13px;border-left:1px solid var(--line);padding-left:5px}
.orow{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:5px;
  cursor:pointer;font-size:12.5px;white-space:nowrap}
.orow:hover{background:var(--panel2)}
.tw{width:11px;color:var(--faint);font-size:10px;flex:none}
.tw.none{opacity:.35}
.orow b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--faint);font-size:10.5px}
.cyc{color:#e06a7a;font-size:10.5px}
.kc{color:var(--accent);font-size:10.5px;font-weight:700;margin-left:auto}


/* ── business flow: breadcrumb + rail ────────────────────── */
.crumb{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:12.5px;overflow:hidden;white-space:nowrap}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;
  padding:2px 5px;border-radius:5px;font-weight:600}
.crumb button:hover{background:var(--panel)}
.crumb i{color:var(--faint);font-style:normal}
.crumb .ttl{margin-left:auto;color:var(--faint);overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

/* ---- the search box: what is open stays visible ------------------------ */
/* The term survives a pick, and the open member is named beside it. Without
   this the box went blank on Enter and a successful search read as a failure. */
.openchip{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;max-width:52%;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px 3px 8px;font-size:11.5px;font-weight:600;color:var(--text);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.openchip:hover{border-color:var(--accent)}
.openchip i{width:7px;height:7px;border-radius:50%;flex:none}
@keyframes chipin{from{opacity:0;transform:translateY(-50%) scale(.9)}
  to{opacity:1;transform:translateY(-50%) scale(1)}}
.find input{padding-right:150px}
@keyframes hitsin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* the row for the member already open, so the list says where you are */
.hits li.cur{background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}

/* ---- the lineage screen ------------------------------------------------ */
/* One member's place in the application. The header carries the business
   context so the tree is never floating free of the module it belongs to. */
.crumb.lineage{gap:12px;padding:8px 14px}
.crumb.lineage .back{color:var(--faint);font-weight:600}
.crumb.lineage .back:hover{color:var(--text);background:var(--panel)}
.crumb.lineage .focus{display:flex;align-items:center;gap:7px;flex:none}
.crumb.lineage .focus i{width:8px;height:8px;border-radius:50%;flex:none}
.crumb.lineage .focus b{font-size:13.5px;cursor:pointer}
.crumb.lineage .focus em{font-style:normal;color:var(--faint);font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.crumb.lineage .ctx{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.crumb.lineage .ctx b{color:var(--text);font-weight:600}
.crumb.lineage .ctx.dimmed{color:var(--faint);font-style:italic}
.crumb.lineage .dirseg{flex:none;margin-left:auto}
.crumb.lineage .ttl{margin-left:12px;flex:none}
/* ---- live / snapshot ---------------------------------------------------- */
/* Which mode the page is in, always on screen. A map that shows a week-old
   snapshot as if it were current is worse than one with no live mode at all. */
.livebadge{display:inline-flex;align-items:center;gap:6px;flex:none;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;
  color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;cursor:default;user-select:none}
.livebadge i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.livebadge.on{color:#7ee787;border-color:rgba(126,231,135,.35)}
.livebadge.on i{background:#7ee787;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(126,231,135,.45)}
  50%{opacity:.72;box-shadow:0 0 0 4px rgba(126,231,135,0)}}
@media (prefers-reduced-motion:reduce){.livebadge.on i{animation:none}}

/* Which kinds of reaching the lineage tree is following. Offered from what the
   member ACTUALLY has, with counts, so narrowing is a decision the reader makes
   rather than one the code made silently. */
.kindbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.kbl{color:var(--faint);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.09em;font-weight:700;margin-right:2px}
.kchip{display:inline-flex;align-items:center;gap:6px;background:none;
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  color:var(--faint);cursor:pointer;font-size:11.5px;font-weight:600}
.kchip i{width:7px;height:7px;border-radius:50%;flex:none;opacity:.35}
.kchip b{font-weight:700;font-size:10.5px;opacity:.75;
  font-variant-numeric:tabular-nums}
.kchip.on{color:var(--text);border-color:var(--line-2,var(--line));
  background:var(--panel2)}
.kchip.on i{opacity:1}
.kchip:hover{border-color:var(--accent)}
.kchip.clear{color:var(--accent);border-style:dashed}

.rootbtns{display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:14px}
.rootbtns .rootbtn{margin-bottom:0}

/* The work-on-demand button. The blast radius costs 22.8ms on a hub - real
   money on a 16.7ms frame - so it is not computed until it is asked for. */
.lazybtn{display:block;width:100%;text-align:left;background:var(--panel2);
  border:1px dashed var(--line-2,var(--line));border-radius:9px;padding:11px 13px;
  color:var(--text);cursor:pointer;font-size:12.5px;font-weight:600;
  transition:border-color .18s,background .18s,transform .12s}
.lazybtn:hover{border-color:var(--accent);background:var(--panel)}
.lazybtn:active{transform:scale(.99)}
.lazybtn em{display:block;font-style:normal;font-weight:400;color:var(--faint);
  font-size:11px;margin-top:3px}

/* ---- motion ------------------------------------------------------------- */
/* A token system rather than a guessed number per rule, so everything on the
   page accelerates and settles the same way. The curves are the published ones,
   not invented:
     --e-emph    Material 3 "emphasised decelerate" - the entry curve. Fast out
                 of the gate, long tail. What makes an entrance feel unhurried
                 without being slow.
     --e-std     Material 3 standard - for anything reversible (hover, toggles).
     --e-spring  a back-out with ~10% overshoot, for things that should feel
                 physical: a chip landing, a button releasing.
   Durations follow the same source: 150ms for feedback the finger expects
   immediately, 250ms for an element entering, 400ms for a whole panel or view.
   Anything over ~500ms reads as the app thinking, so nothing here is. */
:root{
  --e-emph:cubic-bezier(.05,.7,.1,1);
  --e-std:cubic-bezier(.2,0,0,1);
  --e-spring:cubic-bezier(.34,1.4,.64,1);
  --d-fast:.15s; --d-mid:.25s; --d-slow:.4s;
}

/* Panels enter from the edge they live on, so the motion agrees with the
   layout instead of fighting it. */
.side{animation:panelin var(--d-slow) var(--e-emph) both}
.rail{animation:railin var(--d-slow) var(--e-emph) both}
@keyframes panelin{from{opacity:0;transform:translate3d(14px,0,0)}to{opacity:1;transform:none}}
@keyframes railin{from{opacity:0;transform:translate3d(-14px,0,0)}to{opacity:1;transform:none}}
.crumb{animation:barin var(--d-mid) var(--e-emph) both}
@keyframes barin{from{opacity:0;transform:translate3d(0,-6px,0)}to{opacity:1;transform:none}}

/* Sections stagger. 45ms apart is enough to read as a sequence and short
   enough that the whole panel is settled inside 400ms. */
.dsec{animation:secin var(--d-mid) var(--e-emph) both}
.dsec:nth-of-type(1){animation-delay:.03s}
.dsec:nth-of-type(2){animation-delay:.075s}
.dsec:nth-of-type(3){animation-delay:.12s}
@keyframes secin{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}

/* The tiers cascade, because they ARE a ranking and motion can say so. */
.tier{animation:tierin var(--d-mid) var(--e-emph) both;transition:border-color var(--d-fast)}
.tier.t1{animation-delay:.02s} .tier.t2{animation-delay:.07s} .tier.t3{animation-delay:.12s}
@keyframes tierin{from{opacity:0;transform:translate3d(-6px,0,0)}to{opacity:1;transform:none}}

/* Hover feedback: 150ms, and the row moves toward the pointer rather than
   merely changing colour. translate3d keeps it on the compositor. */
.rel li,.frow,.hits li,.orow{
  transition:background var(--d-fast) var(--e-std),
             box-shadow var(--d-fast) var(--e-std),
             transform var(--d-fast) var(--e-std)}
.rel li:hover,.frow:hover,.orow:hover{transform:translate3d(3px,0,0)}
.rel li:active,.frow:active{transform:translate3d(1px,0,0) scale(.995)}

.seg button{transition:background var(--d-fast) var(--e-std),
  color var(--d-fast) var(--e-std),box-shadow var(--d-mid) var(--e-std)}
.rootbtn,.lazybtn{transition:border-color var(--d-fast) var(--e-std),
  background var(--d-fast) var(--e-std),transform var(--d-fast) var(--e-spring)}
.rootbtn:hover{background:var(--panel)}
.rootbtn:active,.lazybtn:active{transform:scale(.985)}
.openchip{animation:chipin var(--d-mid) var(--e-spring) both}
.hits{animation:hitsin var(--d-fast) var(--e-emph) both}

/* Keyboard users get the same clarity as pointer users. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

/* Motion is never the reason someone cannot use this. Honour the OS setting and
   drop ALL of it - including the transforms, which is the bit people forget. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rel li:hover,.frow:hover,.orow:hover,.rel li:active,.frow:active{transform:none!important}
}

.flowrail{padding:6px 4px 24px}
.fgroup{margin-bottom:2px}
.frow{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;
  cursor:pointer;font-size:12.5px;white-space:nowrap;overflow:hidden}
.frow:hover{background:var(--panel2)}
.frow.on{background:var(--panel2)}
.frow.mod b{font-size:13px}
.frow.mod.on b{color:var(--accent)}
.frow.comp{padding-left:20px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px}
.frow.proc{padding-left:36px;color:var(--dim);font-size:12px;
  text-overflow:ellipsis;overflow:hidden;display:block}
.frow.proc.on{color:var(--text);font-weight:600}
.frow .opt{display:inline-block;min-width:17px;margin-right:6px;color:var(--faint);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.frow .kc{margin-left:auto;color:var(--faint);font-size:10.5px;font-weight:700}


/* ── build indicator ─────────────────────────────────────── */
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:11px 16px;box-shadow:var(--shadow);z-index:30;min-width:264px;
  animation:rise .22s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(8px)}
                to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast b{display:block;font-size:12.5px;text-transform:capitalize}
.toast span{color:var(--faint);font-size:11.5px}
.toast .spin{width:15px;height:15px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast .bar{grid-column:1/3;height:3px;border-radius:2px;background:var(--panel2);
  overflow:hidden}
.toast .bar i{display:block;height:100%;background:var(--accent);
  transition:width .12s linear}

/* ── details ─────────────────────────────────────────────── */
.side{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow:auto;padding:14px}
.dhead{display:flex;gap:11px;align-items:flex-start}
.dlay{width:4px;border-radius:3px;align-self:stretch;min-height:38px;flex:none}
.dhead h2{margin:0;font-size:17px;letter-spacing:-.01em;text-wrap:balance;
  line-height:1.28}
.dhead p{margin:3px 0 0;color:var(--dim);font-size:12px}
/* The member id, demoted out of the heading but still first on the line under
   it - it is the property everything else in the estate is keyed by. */
.dhead p .mid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--text);letter-spacing:.01em}
.dhead .inferred{margin-left:auto;flex:none;align-self:flex-start;
  font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.09em;padding:3px 5px;border-radius:4px;
  background:var(--panel2);border:1px solid var(--line);color:var(--faint);
  cursor:help;white-space:nowrap}
.desc{margin:12px 0;font-size:13px;color:var(--dim);line-height:1.55}
.desc.lede{color:var(--text);font-size:13.5px;margin-bottom:10px}
/* The module's one line, shown only while that module is open, so nine of them
   do not stack up in a rail that is meant to be scanned. */
.moddesc{padding:2px 10px 8px 26px;font-size:11.5px;color:var(--faint);
  line-height:1.45}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.facts div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.facts dd{margin:2px 0 0;font-size:16px;font-weight:700}
.path{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--faint);word-break:break-all;margin-bottom:11px}
.rootbtn{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px;color:var(--accent);cursor:pointer;
  font-size:12.5px;font-weight:600;margin-bottom:14px}
.rootbtn:hover{border-color:var(--accent)}
.rel{margin-top:14px}
.rel h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.rel h4 span{color:var(--dim);margin-left:5px}
.rel ul{list-style:none;margin:0;padding:0}
.rel li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;
  cursor:pointer;font-size:12.5px}
.rel li:hover{background:var(--panel2)}
.rel li i{width:7px;height:7px;border-radius:50%;flex:none}
.rel li span{color:var(--faint);font-size:10.5px;margin-left:auto}
.more{color:var(--faint);font-size:11.5px;margin:4px 6px}

/* ---- the details panel: connections and impact ------------------------- */
/* The panel is the whole reason to click a node, so it carries three sections
   and needs to stay readable at 330px. Everything here is inside .side. */
.detail{scrollbar-gutter:stable}
.dhead .hub{margin-left:auto;flex:none;align-self:center;font:600 9.5px/1 ui-monospace,
  SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;color:#0d1117;
  background:var(--warn,#ffb454);border-radius:3px;padding:4px 5px}
.dsec{margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}
.dsec>h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--dim)}
.kc{margin-left:6px;color:var(--faint);font-weight:400;
  font-variant-numeric:tabular-nums}

/* One group per relationship kind. The arrow and the verb together say which
   direction is being listed - "who calls me" and "who I call" are different
   questions and a merged list answers neither. */
.rel h4{display:flex;align-items:center;gap:5px}
.rel h4 em{font-style:normal;text-transform:none;letter-spacing:0;
  color:var(--faint);font-size:10.5px}
.rel h4 .rin{color:#79c0ff;font-size:12px}
.rel h4 .rout{color:#7ee787;font-size:12px}
.rel li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the member:line citation - evidence, so it is always visible, never a hover */
.rel li u{text-decoration:none;color:var(--faint);font-size:10px;flex:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rel li span{margin-left:auto;flex:none}

/* The three impact tiers. The left rule carries the severity so the eye reads
   the ranking before it reads a word. */
.tier{border-left:2px solid var(--line);padding:2px 0 2px 11px;margin:0 0 13px}
.tier:last-of-type{margin-bottom:9px}
.tier.t1{border-left-color:#f0883e}
.tier.t2{border-left-color:#d29922}
.tier.t3{border-left-color:#484f58}
.tier b{display:block;font-size:12.5px;font-weight:600}
.tier em{display:block;font-style:normal;color:var(--faint);font-size:11px;
  line-height:1.5;margin-top:3px}
.tier .names{margin:7px 0 0;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,
  Consolas,monospace;color:var(--dim);word-break:break-word}

.mini{color:var(--faint);font-size:11.5px;line-height:1.55;margin:9px 0 0}
.mini.dim{color:var(--line-2,var(--faint));opacity:.8}
.mini .loud{color:#ff7b72}
/* Live and snapshot disagreeing is NEWS, not noise: it means the graph has
   moved on from the picture. Marked rather than silently reconciled. */
.mini.warnline{border-left:2px solid #d29922;padding-left:9px}
.mini b{color:var(--text)}
.warnbox{background:rgba(240,136,62,.09);border:1px solid rgba(240,136,62,.32);
  border-radius:7px;padding:9px 11px;margin:11px 0 0;font-size:11.5px;
  line-height:1.55;color:var(--dim)}
.tier .warnbox{margin:8px 0 0}

.empty h3{margin:6px 0 4px;font-size:15px}
.empty p{margin:0 0 16px;color:var(--dim);font-size:12.5px}
.key{display:flex;flex-direction:column;gap:9px}
.krow{display:grid;grid-template-columns:9px 1fr auto;gap:8px;align-items:center;
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.krow i{width:9px;height:9px;border-radius:50%}
.krow b{font-size:12.5px}
.krow span{color:var(--faint);font-size:11px}
.krow p{grid-column:2/4;margin:2px 0 0;color:var(--dim);font-size:11.5px;line-height:1.45}

/* ── footer ──────────────────────────────────────────────── */
.foot{display:flex;gap:16px;align-items:center;padding:6px 14px;
  background:var(--panel);border-top:1px solid var(--line);
  color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden}
.foot .lines{color:var(--dim)}
.foot .src{overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.foot .hov{margin-left:auto;color:var(--text);font-weight:700;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

@media (max-width:1100px){ .side{width:270px} .rail{width:250px} }
@media (max-width:860px){
  .side{display:none}
  .bar{flex-wrap:wrap}
  .find{order:9;max-width:none;flex-basis:100%}
}

/* ═══ the process view ═══════════════════════════════════════════════════
   Documents, not diagrams. A process is read top to bottom, so this is a
   reading column with a real measure - not boxes on a pannable board. */
.pview{flex:1;display:flex;min-height:0;background:var(--bg)}
.pscroll{flex:1;min-width:0;overflow-y:auto}
.pwrap{max-width:980px;margin:0 auto;padding:34px 40px 80px}
.pwrap.narrow{max-width:800px}
.ppick{height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:14px;padding:40px;text-align:center}

.phero h1{margin:0 0 10px;font-size:30px;font-weight:650;letter-spacing:-.025em;
  line-height:1.18;text-wrap:balance}
.phero p{margin:0;color:var(--dim);font-size:15px;line-height:1.6;max-width:64ch}
.pstats{display:flex;flex-wrap:wrap;gap:32px;margin:26px 0 34px;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pstats b{display:block;font-size:23px;font-weight:600;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pstats span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:19px 20px;display:flex;flex-direction:column;gap:9px;cursor:pointer;
  text-align:left;transition:border-color .13s,transform .13s}
.pcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pcard h3{margin:0;font-size:17px;font-weight:620;letter-spacing:-.015em;
  line-height:1.28;text-wrap:balance}
.pcard p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.5}
.pcard footer{margin-top:auto;padding-top:4px;display:flex;gap:6px;flex-wrap:wrap}

/* ── the list ── */
.plist{flex:0 0 340px;display:flex;flex-direction:column;min-width:0;
  border-right:1px solid var(--line);background:var(--panel)}
.plisthead{flex:0 0 auto;padding:15px 16px 13px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.plisthead b{display:block;font-size:14.5px;font-weight:620}
.plisthead span{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.plistscroll{flex:1;overflow-y:auto;padding:8px;display:flex;
  flex-direction:column;gap:6px}
.pseg{display:flex;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:2px;gap:2px}
.pseg button{padding:4px 9px;border-radius:5px;font-size:11.5px;color:var(--dim);
  background:none;border:none;cursor:pointer;white-space:nowrap}
.pseg button.on{background:var(--bg);color:var(--accent);font-weight:600}
.prow{background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  text-align:left;transition:border-color .12s}
.prow:hover{border-color:var(--faint)}
.prow.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.prowtop{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.prowtop span:first-child{font-size:13.5px;font-weight:600;line-height:1.35}
.prow p{margin:0;font-size:12px;color:var(--dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prowfoot{display:flex;gap:5px;flex-wrap:wrap}

/* ── one process ── */
.pcrumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:0 0 18px;font-size:12.5px}
.pcrumb span{display:flex;align-items:center;gap:7px}
.pcrumb button{background:none;border:none;color:var(--accent);cursor:pointer;
  font:inherit;padding:1px 0;border-bottom:1px solid transparent}
.pcrumb button:hover{border-bottom-color:var(--accent)}
.pcrumb em{font-style:normal;color:var(--dim)}
.pcrumb i{font-style:normal;color:var(--faint)}
.pback{background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:13px;padding:0 0 16px}
.phead{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.phead h1{margin:0 0 9px;font-size:28px;font-weight:650;letter-spacing:-.025em;
  line-height:1.2;text-wrap:balance}
.plede{margin:0;font-size:16px;color:var(--dim);line-height:1.55;max-width:62ch}
.ptrigger{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px;
  font-size:13px;color:var(--dim)}
.pwarn{margin:16px 0 0;padding:11px 14px;border-radius:8px;font-size:12.5px;
  line-height:1.5;background:var(--panel2);border:1px solid var(--line)}
.psec{margin:0 0 16px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);font-weight:600}

.ptree,.psub{list-style:none;margin:0;padding:0}
.ptree{margin-bottom:36px}
.psub{margin:0 0 0 12px;padding-left:22px;border-left:1px solid var(--line)}
.ptree>li{padding-bottom:14px}
.psub>li{position:relative;padding:10px 0 0}
.psub>li::before{content:"";position:absolute;left:-22px;top:21px;width:16px;
  height:1px;background:var(--line)}
.pstep{display:flex;gap:12px;align-items:flex-start}
.pnum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:var(--bg);font-size:12px;font-weight:700;display:flex;
  align-items:center;justify-content:center;margin-top:1px}
.pdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint);
  margin:8px 8px 0 0}
.pstepbody{min-width:0;flex:1}
.pstephead{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.psteptitle{font-size:15px;font-weight:620;letter-spacing:-.008em}
.pstepline{margin:3px 0 0;font-size:13.5px;color:var(--dim);line-height:1.55;
  max-width:68ch}
.pstepline.util{color:var(--faint);font-style:italic}

.pfiles{margin-bottom:22px}
.pfiles h3{margin:0 0 9px;font-size:13px;font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pfile{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:3px 9px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line);color:var(--text)}
.pfile.w{border-color:var(--accent)}
.pfile i{font-style:normal;font-size:9.5px;letter-spacing:.06em;color:var(--accent)}
.pempty{padding:34px 8px;text-align:center;color:var(--faint);font-size:13.5px}

/* ── tags shared by all three levels ── */
.ptag{display:inline-flex;align-items:center;font-size:10px;line-height:1.7;
  padding:1px 7px;border-radius:4px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;font-weight:500}
.ptag.live,.ptag.batch,.ptag.inf,.ptag.ok{letter-spacing:.06em;
  text-transform:uppercase;font-size:9.5px;border-color:transparent}
.ptag.live{color:var(--accent)}
.ptag.batch{color:var(--text)}
.ptag.inf{color:var(--faint)}
.ptag.ok{color:var(--dim)}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--panel2);
  border:1px solid var(--line);color:var(--text);white-space:nowrap}

@media (max-width:1000px){
  .pwrap{padding:26px 24px 60px}
  .plist{flex-basis:290px}
}
@media (max-width:760px){
  .pview{flex-direction:column}
  .plist{flex:0 0 auto;max-height:42vh;border-right:none;
    border-bottom:1px solid var(--line)}
  .pwrap{padding:22px 16px 48px}
  .phero h1,.phead h1{font-size:23px}
  .pstats{gap:20px}
  .pstats b{font-size:19px}
  .psub{padding-left:14px;margin-left:6px}
  .psub>li::before{left:-14px;width:10px}
}
</style>
</head>
